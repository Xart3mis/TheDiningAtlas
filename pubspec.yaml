name: dining_atlas
description: The Dining Atlas - Restaurant Discovery App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  provider: ^6.1.5+1
  google_sign_in: 6.2.1
  geoflutterfire_plus: ^0.0.34
  image_picker: ^1.2.2
  geolocator: ^14.0.2
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
  shimmer: ^3.0.0
  connectivity_plus: ^7.1.1
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
