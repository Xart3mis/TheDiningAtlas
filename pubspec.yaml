name: dining_atlas
description: The Dining Atlas - Restaurant Discovery App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.7
  provider: ^6.1.2
  google_sign_in: ^6.2.1
  geoflutterfire_plus: ^0.0.32
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  http: ^1.2.2
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.1
  cached_network_image: ^3.4.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20
  geolocator_android: ^6.0.0

flutter:
  uses-material-design: true
